name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and version check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.2 is the declared floor (Requires PHP) and 8.5 is the newest stable
        # release; 8.3 and 8.4 are between them. Every one must pass, because a
        # syntax that is fine on one can be fatal on another. There is no upper
        # bound: add each new PHP release here as soon as setup-php offers it.
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax check every PHP file
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "::error file=$f::PHP syntax error"
              php -l "$f" || true
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0)
          exit $fail

      - name: Versions must agree
        # The plugin header, AUTO_SEO_VERSION and readme.txt's stable tag are
        # three places one number lives. They drift silently, and a mismatch
        # means the updater offers a version that is not the one users receive.
        run: |
          set -e
          header=$(grep -m1 '^ \* Version:' auto-seo-manager.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r')
          const=$(grep -m1 "define('AUTO_SEO_VERSION'" auto-seo-manager.php | sed -E "s/.*'([0-9.]+)'.*/\1/")
          stable=$(grep -m1 '^Stable tag:' readme.txt | sed -E 's/.*Stable tag:[[:space:]]*//' | tr -d '\r')
          echo "header=$header const=$const readme=$stable"
          if [ "$header" != "$const" ] || [ "$header" != "$stable" ]; then
            echo "::error::Version mismatch - header=$header AUTO_SEO_VERSION=$const readme.txt=$stable"
            exit 1
          fi

      - name: Guard against debug leftovers
        run: |
          set -e
          if grep -rn --include='*.php' -E '\b(var_dump|print_r\s*\()' . \
              --exclude-dir=vendor --exclude-dir=.git | grep -v '^\./\.github/'; then
            echo "::error::Debug output left in the source"
            exit 1
          fi
